<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>장바구니 | IKETA</title>
  <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      crossorigin="anonymous" referrerpolicy="no-referrer" />
      
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="cart.css"> <!-- 장바구니 전용 스타일 -->
  <link rel="icon" type="image/x-icon" href="./images/favicon.ico">
</head>
<body>
  <div class="page-wrapper">
  <!-- 헤더 (메인과 동일) -->
  <header class="header">
      <div class="brand" id="brandMenuTrigger">
        <a href="index.html">
          <img src="./images/favicon.ico" alt="IKETA 로고 아이콘" class="logo-icon">
          IKETA
        </a>
      </div>
    <div class="icons">
      <i class="fa-solid fa-magnifying-glass"></i>
      <div class="cart-wrapper" id="cartIcon">
        <i class="fa-solid fa-bag-shopping"></i>
        <span class="cart-badge" id="cartCount">0</span>
      </div>
    </div>
    <!-- 검색창 오버레이 -->
<div id="searchOverlay" class="search-overlay hidden">
    <div class="search-box">
        <input type="text" placeholder="검색어를 입력하세요" autocomplete="off">
      <button id="closeSearch">×</button>
    </div>
  </div>
  </header>

  <!-- 메인 -->
  <main class="cart-page">
    <h1>장바구니</h1>
    <div id="cartItems">
      <!-- 여기 JS로 상품들이 추가될 예정 -->
    </div>
    <div class="cart-total">
      총 합계: <span id="cartTotal">₩0</span>
    </div>
    <div class="cart-actions">
        <button class="continue-btn" id="continueShopping">쇼핑 계속하기</button>
        <button class="order-btn">주문하기</button>   
    </div>
  </main>

  <!-- 푸터 -->
  <footer class="footer">
    <div class="footer-inner">
      <p class="footer-brand">IKETA</p>
      <p class="footer-copy">© 2025 IKETA. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
  <script src="product.js"></script>
  <script src="cart.js"></script> <!-- 장바구니 전용 JS -->
</body>
</html>
